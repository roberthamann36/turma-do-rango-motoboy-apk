plugins {
    id 'com.android.application'
}

def versionProps = new Properties()
def versionFile = rootProject.file('version.properties')
if (versionFile.exists()) {
    versionFile.withInputStream { versionProps.load(it) }
}
def tdrVersionCode = (project.findProperty('versionCodeOverride') ?: versionProps.getProperty('VERSION_CODE', '2')) as Integer
def tdrVersionName = (project.findProperty('versionNameOverride') ?: versionProps.getProperty('VERSION_NAME', '1.1.0')).toString()
def generatedAssetsDir = file("$buildDir/generated/tdrAssets")
def uniboyLogoB64 = rootProject.file("app/src/main/uniboy_logo.b64")
def uniboyIconFile = rootProject.file("app/src/main/res/drawable-nodpi/app_icon.png")

android {
    namespace 'br.com.turmadorango.motoboy'
    compileSdk 35

    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        applicationId 'br.com.uniboy.entregas.moto'
        minSdk 23
        targetSdk 35
        versionCode tdrVersionCode
        versionName tdrVersionName
    }

    sourceSets {
        main {
            assets.srcDirs += generatedAssetsDir
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

tasks.register('generateTdrVersionAsset') {
    outputs.dir generatedAssetsDir
    doLast {
        generatedAssetsDir.mkdirs()
        def payload = "{\"version_code\":${tdrVersionCode},\"version_name\":\"${tdrVersionName}\",\"app_id\":\"UNIBOY-ENTREGAS-APP2\"}"
        new File(generatedAssetsDir, 'tdr_version.json').text = payload
        new File(generatedAssetsDir, 'uniboy_version.json').text = payload
    }
}

tasks.register('prepareUniboyIcon') {
    inputs.file uniboyLogoB64
    outputs.file uniboyIconFile
    doLast {
        if (!uniboyLogoB64.exists()) throw new GradleException("UNIBOY logo base64 ausente")
        uniboyIconFile.parentFile.mkdirs()
        uniboyIconFile.bytes = uniboyLogoB64.text.trim().decodeBase64()
    }
}

tasks.named('preBuild').configure {
    dependsOn tasks.named('generateTdrVersionAsset')
    dependsOn tasks.named('prepareUniboyIcon')
}
