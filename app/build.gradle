plugins {
    id 'com.android.application'
}

def versionProps = new Properties()
def versionFile = rootProject.file('version.properties')
if (versionFile.exists()) {
    versionFile.withInputStream { versionProps.load(it) }
}
def tdrVersionCode = (versionProps.getProperty('VERSION_CODE', '2') as Integer)
def tdrVersionName = versionProps.getProperty('VERSION_NAME', '1.1.0')
def generatedAssetsDir = file("$buildDir/generated/tdrAssets")

android {
    namespace 'br.com.turmadorango.motoboy'
    compileSdk 35

    defaultConfig {
        applicationId 'br.com.turmadorango.motoboy'
        minSdk 23
        targetSdk 35
        versionCode tdrVersionCode
        versionName tdrVersionName
    }

    sourceSets {
        main {
            assets.srcDirs += generatedAssetsDir
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

tasks.register('generateTdrVersionAsset') {
    outputs.dir generatedAssetsDir
    doLast {
        generatedAssetsDir.mkdirs()
        def out = new File(generatedAssetsDir, 'tdr_version.json')
        out.text = "{\"version_code\":${tdrVersionCode},\"version_name\":\"${tdrVersionName}\"}"
    }
}

tasks.named('preBuild').configure {
    dependsOn tasks.named('generateTdrVersionAsset')
}
