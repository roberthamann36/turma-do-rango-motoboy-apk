name: Gerar APK Motoboy

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar Android 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Configurar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Gerar APK instalável
        run: gradle --no-daemon assembleDebug

      - name: Renomear APK
        run: cp app/build/outputs/apk/debug/app-debug.apk TurmaDoRango-Motoboy.apk

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: TurmaDoRango-Motoboy-APK
          path: TurmaDoRango-Motoboy.apk
          if-no-files-found: error
