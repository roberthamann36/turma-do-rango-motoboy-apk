name: Gerar APK Motoboy

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Aceitar licenças Android
        run: yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true

      - name: Instalar Android 35
        run: /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Configurar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Gerar APK release sem assinatura
        run: gradle --no-daemon assembleRelease

      - name: Preparar artefatos
        run: |
          mkdir -p build-output
          cp app/build/outputs/apk/release/app-release-unsigned.apk build-output/TurmaDoRango-Motoboy-unsigned.apk
          cp /usr/local/lib/android/sdk/build-tools/35.0.0/lib/apksigner.jar build-output/apksigner.jar
          cp /usr/local/lib/android/sdk/build-tools/35.0.0/zipalign build-output/zipalign
          chmod +x build-output/zipalign

      - name: Publicar APK e ferramentas
        uses: actions/upload-artifact@v4
        with:
          name: TurmaDoRango-Motoboy-RELEASE
          path: build-output/
          if-no-files-found: error
