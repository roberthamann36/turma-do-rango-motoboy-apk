name: Build UNIBOY APP2 Update Test
on:
  push:
    branches:
      - uniboy-app2-test
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Aplicar logo oficial UNIBOY
        run: |
          curl -fL --retry 3 "https://turmadorango.com.br/uploads/apps/uniboy/logo.png" -o app/src/main/res/drawable-nodpi/app_icon.png
          test -s app/src/main/res/drawable-nodpi/app_icon.png

      - name: Gerar versão base 25
        run: |
          gradle clean assembleRelease --stacktrace -PversionCodeOverride=25 -PversionNameOverride=1.0.2
          mkdir -p build-output
          cp app/build/outputs/apk/release/app-release-unsigned.apk build-output/UNIBOY-Entregas-v25-unsigned.apk

      - name: Gerar atualização 26
        run: |
          gradle clean assembleRelease --stacktrace -PversionCodeOverride=26 -PversionNameOverride=1.0.3
          cp app/build/outputs/apk/release/app-release-unsigned.apk build-output/UNIBOY-Entregas-v26-unsigned.apk

      - name: Publicar APKs sem assinatura
        uses: actions/upload-artifact@v4
        with:
          name: UNIBOY-APP2-UPDATE-TEST-25-26
          path: build-output/
          if-no-files-found: error
