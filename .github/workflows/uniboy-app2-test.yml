name: Build UNIBOY APP2 Test
on:
  push:
    branches:
      - uniboy-app2-test
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk UNIBOY-Entregas-TESTE-v24.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: UNIBOY-Entregas-TESTE-v24
          path: UNIBOY-Entregas-TESTE-v24.apk
          if-no-files-found: error
