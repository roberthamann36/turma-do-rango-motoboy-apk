name: Build UNIBOY APP2 v28
on:
  push:
    branches:
      - uniboy-app2-test
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Aplicar logo oficial UNIBOY
        run: |
          curl -fL --retry 3 "https://turmadorango.com.br/uploads/apps/uniboy/logo.png" -o app/src/main/res/drawable-nodpi/app_icon.png
          test -s app/src/main/res/drawable-nodpi/app_icon.png

      - name: Gerar versão 28
        run: |
          gradle clean assembleRelease --stacktrace -PversionCodeOverride=28 -PversionNameOverride=1.1.0
          mkdir -p build-output
          cp app/build/outputs/apk/release/app-release-unsigned.apk build-output/UNIBOY-Entregas-v28-unsigned.apk

      - name: Publicar APK sem assinatura
        uses: actions/upload-artifact@v4
        with:
          name: UNIBOY-Entregas-v28-unsigned
          path: build-output/UNIBOY-Entregas-v28-unsigned.apk
          if-no-files-found: error
